name: Verificar entrenador de voz
on:
  push:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  pull_request:
    paths: ["ai/**", ".github/workflows/ai-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrenador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install -r ai/requirements.txt
      - name: Dataset y recorrido técnico con señales de prueba temporales
        run: python -m unittest discover -s ai/tests -v
