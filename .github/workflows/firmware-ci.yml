name: Compilar firmware ESP32-S3

on:
  push:
    paths:
      - "firmware/casa_inteligente_v4/**"
      - "firmware/domus_esqueleto/**"
      - "firmware/domus_selftest/**"
      - "firmware/domus_anim/**"
      - "firmware/tests/**"
      - "assets/new/deliverables/execute/01_FINAL_V2/simulator/**"
      - "obsidian/proyect domus/**"
      - "scripts/validate_project.py"
      - "README.md"
      - "PLAN_PROYECTO.md"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "firmware/casa_inteligente_v4/**"
      - "firmware/domus_esqueleto/**"
      - "firmware/domus_selftest/**"
      - "firmware/domus_anim/**"
      - "firmware/tests/**"
      - "assets/new/deliverables/execute/01_FINAL_V2/simulator/**"
      - "obsidian/proyect domus/**"
      - "scripts/validate_project.py"
      - "README.md"
      - "PLAN_PROYECTO.md"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar simulador y contratos del firmware
        run: python scripts/validate_project.py

  compilar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: n16r8-original
            board: FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,LoopCore=1
            economical: 0
          - name: n16r8-economico
            board: FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,LoopCore=1
            economical: 1
          - name: n16r8-sd
            board: FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,LoopCore=1
            economical: 0
            sd: 1
          - name: 4m-sin-psram
            board: FlashSize=4M,PSRAM=disabled,PartitionScheme=huge_app,CPUFreq=160,LoopCore=0
            economical: 0
          - name: 8m-qspi
            board: FlashSize=8M,PSRAM=enabled,PartitionScheme=default_8MB,CPUFreq=80,LoopCore=1
            economical: 0

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Instalar ESP32 y bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set network.connection_timeout 240s
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"

      - name: Compilar perfil ${{ matrix.name }}
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:${{ matrix.board }}" \
            --build-property "compiler.cpp.extra_flags=-DDOMUS_SALIDAS_ECONOMICAS=${{ matrix.economical }} -DMICROSD_HABILITADA=${{ matrix.sd || 0 }}" \
            --warnings all \
            --output-dir build/firmware \
            firmware/casa_inteligente_v4

      - name: Guardar binarios
        uses: actions/upload-artifact@v4
        with:
          name: project-domus-${{ matrix.name }}
          path: build/firmware/
          if-no-files-found: error
          retention-days: 14

  compilar-perfiles-alfa:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        perfil: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Instalar ESP32 y bibliotecas de la base
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
      - name: Compilar esqueleto perfil ${{ matrix.perfil }}
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,LoopCore=1" \
            --build-property "compiler.cpp.extra_flags=-DDOMUS_PERFIL_ALFA=${{ matrix.perfil }}" \
            --warnings all \
            --output-dir build/esqueleto-perfil-${{ matrix.perfil }} \
            firmware/domus_esqueleto
      - uses: actions/upload-artifact@v4
        with:
          name: project-domus-esqueleto-perfil-${{ matrix.perfil }}
          path: build/esqueleto-perfil-${{ matrix.perfil }}/
          if-no-files-found: error
          retention-days: 14

  compilar-base-modular:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sketch:
          - domus_esqueleto
          - domus_selftest
          - domus_anim
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Instalar ESP32 y bibliotecas de la base
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
      - name: Compilar ${{ matrix.sketch }}
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB,CPUFreq=240,LoopCore=1" \
            --warnings all \
            --output-dir build/${{ matrix.sketch }} \
            firmware/${{ matrix.sketch }}
      - uses: actions/upload-artifact@v4
        with:
          name: project-domus-${{ matrix.sketch }}
          path: build/${{ matrix.sketch }}/
          if-no-files-found: error
          retention-days: 14
