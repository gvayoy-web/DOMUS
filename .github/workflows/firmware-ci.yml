name: Compilar firmware ESP32-S3

on:
  push:
    paths:
      - "firmware/casa_inteligente_v4/**"
      - "firmware/tests/**"
      - "assets/new/deliverables/execute/01_FINAL_V2/simulator/**"
      - "obsidian/proyect domus/**"
      - "scripts/validate_project.py"
      - "README.md"
      - "PLAN_PROYECTO.md"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "firmware/casa_inteligente_v4/**"
      - "firmware/tests/**"
      - "assets/new/deliverables/execute/01_FINAL_V2/simulator/**"
      - "obsidian/proyect domus/**"
      - "scripts/validate_project.py"
      - "README.md"
      - "PLAN_PROYECTO.md"
      - ".github/workflows/firmware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probar simulador y contratos del firmware
        run: python scripts/validate_project.py

  compilar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Instalar ESP32 y bibliotecas
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set network.connection_timeout 240s
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "LiquidCrystal I2C@1.1.2"
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"

      - name: Compilar para ESP32-S3 N16R8
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --warnings all \
            --output-dir build/firmware \
            firmware/casa_inteligente_v4

      - name: Guardar binarios
        uses: actions/upload-artifact@v4
        with:
          name: project-domus-esp32s3
          path: build/firmware/
          if-no-files-found: error
          retention-days: 14
