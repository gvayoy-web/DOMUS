<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:3}.esp{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.motor{fill:#fef3c7;stroke:#b45309;stroke-width:4}.tr{fill:#dcfce7;stroke:#15803d;stroke-width:4}.warn{fill:#fee2e2;stroke:#b91c1c;stroke-width:4}.h{font:700 30px Arial;fill:#0f172a}.t{font:21px Arial;fill:#1e293b}.pin{font:700 21px monospace;fill:#0f172a}.small{font:18px Arial;fill:#334155}.red{stroke:#dc2626}.black{stroke:#111827}.blue{stroke:#2563eb}.wire{fill:none;stroke-width:7}.label{font:700 18px Arial;fill:#fff}.danger{font:700 23px Arial;fill:#991b1b}
  </style>
  <rect class="bg" width="1600" height="1050"/>
  <text class="h" x="800" y="48" text-anchor="middle">HISTÓRICO — NO CABLEAR · Bomba y ventilador con S8050 (2 transistores)</text>
  <text class="t" x="800" y="82" text-anchor="middle">Superado por domus-alfa-una-carga-s8050.svg (1xS8050 + 1xS8550 reserva) · nota 49 vigente</text>

  <rect class="esp" x="60" y="180" width="265" height="540" rx="22"/>
  <text class="h" x="192" y="225" text-anchor="middle">ESP32-S3</text>
  <text class="pin" x="90" y="325">GPIO4 bomba</text>
  <text class="pin" x="90" y="530">GPIO7 ventilador</text>
  <text class="pin" x="90" y="665">GND</text>

  <rect class="box" x="390" y="275" width="150" height="70" rx="10"/>
  <text class="pin" x="465" y="318" text-anchor="middle">1 kΩ</text>
  <path class="wire blue" d="M325 315 H390 M540 315 H640"/>
  <rect class="tr" x="640" y="230" width="210" height="190" rx="90"/>
  <text class="h" x="745" y="280" text-anchor="middle">S8050 #1</text>
  <text class="pin" x="660" y="334">B</text><text class="pin" x="735" y="397">E</text><text class="pin" x="815" y="334">C</text>
  <path class="wire black" d="M745 420 V665 H325"/>
  <rect class="box" x="560" y="385" width="82" height="145" rx="8"/>
  <text class="small" x="601" y="452" text-anchor="middle">10 kΩ</text><text class="small" x="601" y="476" text-anchor="middle">B→GND</text>
  <path class="wire black" d="M640 385 H600 M600 530 V665"/>

  <rect class="motor" x="1040" y="205" width="245" height="145" rx="25"/>
  <text class="h" x="1162" y="260" text-anchor="middle">BOMBA</text>
  <text class="pin" x="1070" y="315">+        −</text>
  <path class="wire black" d="M850 315 H1040"/>
  <path class="wire red" d="M1070 315 V140 H1440"/>
  <path class="wire red" d="M1285 285 H1390 V140"/>
  <text class="small" x="1335" y="265">1N4007</text><text class="small" x="1335" y="295">RAYA → +5V</text>

  <rect class="box" x="390" y="480" width="150" height="70" rx="10"/>
  <text class="pin" x="465" y="523" text-anchor="middle">1 kΩ</text>
  <path class="wire blue" d="M325 520 H390 M540 520 H640"/>
  <rect class="tr" x="640" y="455" width="210" height="190" rx="90"/>
  <text class="h" x="745" y="505" text-anchor="middle">S8050 #2</text>
  <text class="pin" x="660" y="559">B</text><text class="pin" x="735" y="622">E</text><text class="pin" x="815" y="559">C</text>
  <path class="wire black" d="M745 645 V665"/>
  <rect class="box" x="560" y="590" width="82" height="120" rx="8"/>
  <text class="small" x="601" y="635" text-anchor="middle">10 kΩ</text><text class="small" x="601" y="659" text-anchor="middle">B→GND</text>
  <path class="wire black" d="M640 590 H600 M600 710 V665"/>
  <rect class="motor" x="1040" y="440" width="245" height="145" rx="25"/>
  <text class="h" x="1162" y="495" text-anchor="middle">VENTILADOR</text>
  <text class="pin" x="1070" y="550">+        −</text>
  <path class="wire black" d="M850 550 H1040"/>
  <path class="wire red" d="M1070 550 V140"/>
  <path class="wire red" d="M1285 520 H1390 V140"/>
  <text class="small" x="1335" y="500">1N4007</text><text class="small" x="1335" y="530">RAYA → +5V</text>

  <rect class="motor" x="1330" y="100" width="210" height="120" rx="18"/>
  <text class="h" x="1435" y="148" text-anchor="middle">FUENTE 5 V</text>
  <text class="pin" x="1360" y="190">+5V      GND</text>
  <path class="wire black" d="M1490 220 V665 H325"/>
  <text class="t" x="920" y="700" text-anchor="middle">GND común: ESP32 + fuente + los dos emisores E</text>

  <rect class="warn" x="60" y="780" width="1480" height="210" rx="18"/>
  <text class="danger" x="800" y="830" text-anchor="middle">NO COPIES la posición física de B/C/E desde este dibujo</text>
  <text class="t" x="800" y="872" text-anchor="middle">Primero identifica las tres patas del S8050 por su código y hoja de datos.</text>
  <text class="t" x="800" y="910" text-anchor="middle">Prueba una sola carga por vez · primer pulso ≤ 500 ms · bomba siempre sumergida.</text>
  <text class="t" x="800" y="948" text-anchor="middle">No alimentes motores desde GPIO, 3V3 ni el pin 5V del ESP32.</text>
</svg>
