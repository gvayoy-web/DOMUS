<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480">
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#334155;stroke-width:3;rx:18}.esp{fill:#dbeafe;stroke:#1d4ed8;stroke-width:4}.sensor{fill:#ecfdf5;stroke:#047857;stroke-width:3}.warn{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.no{fill:#fee2e2;stroke:#b91c1c;stroke-width:3}.title{font:700 32px Arial;fill:#0f172a}.h{font:700 23px Arial;fill:#0f172a}.t{font:18px Arial;fill:#1e293b}.small{font:15px Arial;fill:#334155}.pin{font:700 17px monospace;fill:#1d4ed8}.wire{fill:none;stroke-width:5}.safe{font:700 21px Arial;fill:#b91c1c}.danger{font:700 22px Arial;fill:#991b1b}
  </style>
  <rect class="bg" width="1600" height="1960"/>
  <text class="title" x="800" y="50" text-anchor="middle">PROJECT DOMUS — guía final de conexiones (principiantes)</text>
  <text class="t" x="800" y="80" text-anchor="middle">ALFA_UN_COSTADO_SIN_IR · ESP32-S3 N16R8 · sigue LETRAS impresas, nunca izquierda/derecha</text>

  <rect class="warn" x="45" y="100" width="1510" height="120"/>
  <text class="safe" x="800" y="138" text-anchor="middle">DOS RAMAS DE ENERGÍA — USB y fuente de motores solo comparten GND</text>
  <text class="t" x="800" y="170" text-anchor="middle">Rama A: USB → ESP32 + sensores + LCD + LED · Rama B: fuente externa 5 V (3 A o 5 A POR CONFIRMAR) → fusible → driver → SOLO bomba/ventilador</text>
  <text class="small" x="800" y="198" text-anchor="middle">Sin fuente medida: monta etapas S8050 pero deja +5V_MOTORES desconectado · 120 V jamás entra a la maqueta</text>

  <rect class="esp" x="610" y="250" width="380" height="900" rx="28"/>
  <text class="h" x="800" y="295" text-anchor="middle">ESP32-S3 N16R8</text>
  <text class="t" x="800" y="322" text-anchor="middle">costado accesible · USB rama A</text>
  <g class="pin">
    <text x="650" y="368">3V3 → riel sensores/LCD</text><text x="650" y="402">GND → riel común</text>
    <text x="650" y="452">GPIO3 ← LDR (divisor)</text><text x="650" y="486">GPIO5 → LED sala</text>
    <text x="650" y="520">GPIO6 → LED cuarto</text><text x="650" y="554">GPIO8 → LED cultivo x3</text>
    <text x="650" y="588">GPIO9 ← PIR OUT</text><text x="650" y="622">GPIO10 ← STOP</text>
    <text x="650" y="656">GPIO11 ← SILENCIO</text><text x="650" y="690">GPIO13 ↔ LCD SCL</text>
    <text x="650" y="724">GPIO14 ← DHT DATA</text><text x="650" y="758">GPIO15 ← suelo AO</text>
    <text x="650" y="792">GPIO16 ← nivel S</text><text x="650" y="826">GPIO17 ↔ LCD SDA</text>
    <text x="650" y="860">GPIO18 ← MODO</text>
    <text x="650" y="910">GPIO4/7: SOLO perfil prueba</text><text x="650" y="944">GPIO12: RESERVADO</text>
    <text x="650" y="978">GND fuente B ↔ GND (única unión)</text>
  </g>
  <text class="small" x="800" y="1018" text-anchor="middle">GPIO1/2/21 tapados · 19/20 USB · ningún GPIO admite 5 V</text>
  <text class="small" x="800" y="1044" text-anchor="middle">E/B/C del S8050 por hoja de datos, no por dibujo</text>
  <text class="small" x="800" y="1070" text-anchor="middle">Ver arquitectura: domus-arquitectura-feria.svg</text>

  <rect class="card sensor" x="45" y="250" width="500" height="250"/>
  <text class="h" x="75" y="288">DHT11 (4 patas, cara a ti)</text>
  <text class="pin" x="75" y="330">1 → 3V3 · 2 → GPIO14 · 3 → NADA · 4 → GND</text>
  <text class="t" x="75" y="368">10 kΩ entre pata 2 y 3V3</text>
  <text class="h" x="75" y="412">LCD1602 + mochila I²C</text>
  <text class="pin" x="75" y="450">GND→GND · VCC→3V3 · SDA→17 · SCL→13</text>
  <text class="small" x="75" y="482">Sin letras: contraste + direcciones 0x27/0x3F</text>

  <rect class="card sensor" x="45" y="530" width="500" height="270"/>
  <text class="h" x="75" y="568">Suelo · nivel · PIR (por letras)</text>
  <text class="pin" x="75" y="606">Suelo: VCC→3V3 GND→GND AO→15 (DO libre)</text>
  <text class="pin" x="75" y="640">Nivel: +→3V3 −→GND S→16 (no mojar pines)</text>
  <text class="pin" x="75" y="674">PIR: VCC→3V3 OUT→9 GND→GND</text>
  <text class="small" x="75" y="712">PIR: 1ª prueba a 3V3 · si no detecta, identifica módulo;</text>
  <text class="small" x="75" y="738">5 V solo midiendo OUT ≤3.3 V · espera 30–60 s</text>
  <text class="pin" x="75" y="772">LDR: 3V3─LDR─●─10k─GND · ●→GPIO3</text>

  <rect class="card sensor" x="45" y="830" width="500" height="320"/>
  <text class="h" x="75" y="868">Botones y LED (a GND)</text>
  <text class="pin" x="75" y="906">STOP: GPIO10─botón─GND · MODO: 18─GND</text>
  <text class="pin" x="75" y="940">SILENCIO: GPIO11─botón─GND (INPUT_PULLUP)</text>
  <text class="pin" x="75" y="978">Sala: GPIO5─330Ω-1k─pata LARGA · corta→GND</text>
  <text class="pin" x="75" y="1012">Cuarto: igual en GPIO6</text>
  <text class="pin" x="75" y="1046">Cultivo: GPIO8─┬1k→azul→GND ├1k→azul→GND └1k→rojo→GND</text>
  <text class="small" x="75" y="1080">Cruzando la ranura · pata corta/plano = cátodo</text>
  <text class="small" x="75" y="1106">Representación roja/azul, NO UV</text>

  <rect class="card sensor" x="1055" y="250" width="500" height="380"/>
  <text class="h" x="1085" y="288">UNA carga con 1xS8050 (rama B)</text>
  <text class="pin" x="1085" y="330">GPIO4 o GPIO7 ─1k─┬─B · 10k B→GND · E→GND</text>
  <text class="pin" x="1085" y="368">OUT+ ─┬─(+) CARGA (−)─┬─ C · E→GND</text>
  <text class="pin" x="1085" y="406">1N4007 en paralelo: ┤raya→OUT+ · ▷→C</text>
  <text class="t" x="1085" y="444">TP4056: celda en B+/B− · carga en OUT+/OUT−</text>
  <text class="t" x="1085" y="478">OUT− ↔ GND ESP32 · OUT+ jamás a GPIO/3V3</text>
  <text class="small" x="1085" y="516">Bomba O ventilador, nunca ambas · pulso ≤500 ms</text>
  <text class="small" x="1085" y="542">Bomba sumergida · S8550 en reserva · revisa E/B/C</text>
  <text class="small" x="1085" y="568">El diodo NO es un cable · perfiles ALFA_BOMBA_1/_VENTILADOR_1</text>
  <text class="small" x="1085" y="600">Detalle: domus-alfa-una-carga-s8050.svg</text>

  <rect class="card no" x="1055" y="660" width="500" height="490"/>
  <text class="danger" x="1305" y="700" text-anchor="middle">NO CONECTAR TODAVÍA</text>
  <text class="t" x="1085" y="744">Driver: foto ambas caras + chip + tabla.</text>
  <text class="t" x="1085" y="774">MX1508 ≠ DRV8833 hasta medir · sin nSLEEP</text>
  <text class="t" x="1085" y="818">Audio: MAX98357A + parlante · pines TBD,</text>
  <text class="t" x="1085" y="848">sin duplicar 16/17/18 · MUTE no bloquea</text>
  <text class="t" x="1085" y="892">IR: 21 códigos del mando real, no de internet;</text>
  <text class="t" x="1085" y="922">repeticiones ignoradas en riego/rearme</text>
  <text class="t" x="1085" y="966">GPIO12 reservado · 2ª carga motriz · 5 V a GPIO</text>
  <text class="small" x="1085" y="1010">Cada TBD abre solo con su puerta (nota 46 D–F)</text>
  <text class="small" x="1085" y="1040">Firmware FINAL solo tras puertas (nota 53)</text>
  <text class="small" x="1085" y="1070">Fuente 3 A/5 A: POR CONFIRMAR midiendo</text>
  <text class="small" x="1085" y="1100">Puertas y guion demo: arquitectura-feria</text>

  <rect class="warn" x="45" y="1180" width="1510" height="200"/>
  <text class="safe" x="800" y="1222" text-anchor="middle">ANTES DE ENERGIZAR (USB desconectado)</text>
  <text class="t" x="800" y="1258" text-anchor="middle">Sin corto 3V3-GND ni 5V-GND · +5V_MOTORES suelto si no hay fuente medida · OUT− unido a GND · diodo con raya a OUT+</text>
  <text class="t" x="800" y="1292" text-anchor="middle">Arranque: todo OFF · STOP apaga 4/5/6/7/8 · nivel bajo y timeout bloquean bomba · 15 min vigilados antes de ampliar</text>
  <text class="small" x="800" y="1326" text-anchor="middle">Calibrar seco/húmedo, oscuro/claro y nivel mínimo reales · PARO y CAL SERIE para CAL GUARDAR</text>
  <text class="small" x="800" y="1356" text-anchor="middle">Notas: 46 mapa · 47 guía alfa · 49 una carga · 50 ola 1 · 53 firmware final</text>

  <rect class="bg" x="45" y="1400" width="1510" height="60"/>
  <text class="small" x="800" y="1436" text-anchor="middle">Guion demo 2–4 min y PASS (5 reinicios · 10 bloqueos · 10 timeouts · 1 h): ver domus-arquitectura-feria.svg</text>
</svg>
