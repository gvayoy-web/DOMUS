        voz: { title: &#x27;Voz: buzzer + DFPlayer + MAX&#x27;, note: &#x27;Buzzer núcleo en GPIO15. DFPlayer opcional 17/18 (ya tienes). MAX futuro 16/17/18, exclusivo con DF. Sin micrófono: Jarvis va por IR + frases fijas.&#x27;, rows: [[&#x27;Buzzer 5 V&#x27;, &#x27;GPIO15 vía S8050&#x27;], [&#x27;DF TX&#x27;, &#x27;GPIO17 (ESP TX con 1 k)&#x27;], [&#x27;DF RX&#x27;, &#x27;GPIO18 (ESP RX)&#x27;], [&#x27;MAX BCLK/LRC/DIN&#x27;, &#x27;GPIO16/17/18 futuro&#x27;], [&#x27;Parlante&#x27;, &#x27;Solo entre SPK+ y SPK−&#x27;]] },
        power: { title: &#x27;Energía 120 V → 5 V&#x27;, note: &#x27;Extensión externa: cargador USB + fuente cerrada. Batería/solar decoración desconectada.&#x27;, rows: [[&#x27;Extensión 120 V&#x27;, &#x27;Cargador USB + fuente 5 V/5 A&#x27;], [&#x27;Fuente&#x27;, &#x27;Fusible lento 4 A → switch 5 A → 5V_BUS&#x27;], [&#x27;1000 µF&#x27;, &#x27;Junto a DRV y MAX, franja a GND&#x27;], [&#x27;100 nF&#x27;, &#x27;Local en cada módulo&#x27;]] }
      };
      const select = root.querySelector(&#x27;#domus-module-select&#x27;);

      const renderDetail = () =&gt; {
        const item = modules[select.value];
